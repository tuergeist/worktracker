name: Build & push Docker image

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Pinned, not derived from github.repository. Deriving it meant the published
  # image path moved the moment the repo was renamed, while k8s-infra pins that
  # path in three places — so a rename would have silently pointed the deploy at
  # an image nobody publishes any more.
  IMAGE_NAME: ${{ github.repository_owner }}/scratchlab
  # Transitional second target so the path k8s-infra currently deploys from
  # keeps receiving tags. Drop this, and the extra line under `images:` below,
  # once k8s-infra references scratchlab.
  LEGACY_IMAGE_NAME: ${{ github.repository_owner }}/worktracker

jobs:
  # requirements.txt is generated from requirements.in, and nothing stops the
  # two from drifting: editing the .in without regenerating leaves the image
  # installing the old lock, silently. Recompiling here and diffing catches it.
  # uv keeps the pins already in the output file, so this does not turn into a
  # red build every time some upstream publishes a release.
  lock-check:
    name: Lock matches requirements.in
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: Recompile the lock and compare
        run: |
          set -euo pipefail
          py=$(sed -n 's/^FROM python:\([0-9.]*\)-slim.*/\1/p' Dockerfile)
          if [ -z "$py" ]; then
            echo "::error::Could not read the Python version from the Dockerfile"
            exit 1
          fi
          echo "Resolving for Python $py (from the Dockerfile's base image)"
          cp requirements.txt /tmp/requirements.expected
          uv pip compile requirements.in --python-version "$py" --quiet \
            --universal --generate-hashes -o requirements.txt
          if ! diff -u /tmp/requirements.expected requirements.txt; then
            echo "::error::requirements.txt is out of date. Run the command in the header of requirements.in and commit the result."
            exit 1
          fi
          echo "Lock is current."

  build:
    needs: lock-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Only log in / push on non-PR events (PRs from forks lack package write).
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ env.REGISTRY }}/${{ env.LEGACY_IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trigger the k8s-infra deploy-simple pipeline (GitOps via repository_dispatch).
      - name: Short SHA
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        id: shortsha
        run: echo "sha=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: Deploy scratchlab
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.K8S_INFRA_PAT }}
          repository: expert-sieve/k8s-infra
          event-type: deploy-simple
          client-payload: '{"app":"scratchlab","image_tag":"sha-${{ steps.shortsha.outputs.sha }}"}'
