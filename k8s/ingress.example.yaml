# Example ingress for scratchlab.app (nginx-ingress + cert-manager).
# Copy to ingress.yaml, adjust host/issuer, apply.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: worktracker
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [scratchlab.app]
      secretName: scratchlab-tls
  rules:
    - host: scratchlab.app
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: worktracker
                port:
                  number: 80
